services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retailiq}
      POSTGRES_USER: ${POSTGRES_USER:-retailiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailiq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retailiq} -d ${POSTGRES_DB:-retailiq}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - retailiq_postgres:/var/lib/postgresql/data

volumes:
  retailiq_postgres:
