name: Full data audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: retailiq_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retailiq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RETAILIQ_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/retailiq_test
      RETAILIQ_DB_URL: postgresql://postgres:postgres@localhost:5432/retailiq_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Download and normalise UCI Online Retail II
        run: retailiq ingest

      - name: Profile full source
        run: retailiq profile

      - name: Build and reconcile full warehouse
        run: retailiq warehouse-build

      - name: Print verified portfolio metrics
        run: python scripts/print_verified_metrics.py
